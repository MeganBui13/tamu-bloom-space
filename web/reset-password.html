<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reset Password</title>
  </head>
  <body>
    <p>Redirecting to the app to complete password reset. If you are not redirected, <a id="link" href="#">click here</a>.</p>
    <script>
      (function () {
        const searchParams = new URLSearchParams(window.location.search);
        const hash = window.location.hash.startsWith('#')
          ? window.location.hash.slice(1)
          : window.location.hash;

        // Supabase recovery links often place the important values in the hash.
        // Convert those into normal query params before handing off to Flutter's hash router.
        const hashParams = new URLSearchParams(hash);
        for (const [key, value] of hashParams.entries()) {
          searchParams.set(key, value);
        }

        const qs = searchParams.toString();
        const path = '/reset-password';
        const target = `${location.origin}/#${path}${qs ? `?${qs}` : ''}`;

        // Send users into the Flutter route with all recovery params preserved.
        window.location.replace(target);
        document.getElementById('link').href = target;
      })();
    </script>
  </body>
</html>
